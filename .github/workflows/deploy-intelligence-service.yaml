name: Deploy Intelligence Service

on:
  push:
    branches:
      - master
    paths:
      - 'TeamAI Backend/intelligence-service/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/distributed-team-ai-intelligence-service

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Intelligence Service to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Maven Wrapper (permissions + line endings)
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' "TeamAI Backend/common-lib/mvnw" || true
          sed -i 's/\r$//' "TeamAI Backend/intelligence-service/mvnw" || true
          chmod +x "TeamAI Backend/common-lib/mvnw" "TeamAI Backend/intelligence-service/mvnw"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Install Common Lib
        working-directory: './TeamAI Backend/common-lib'
        run: ./mvnw clean install -DskipTests

      - name: Build and Push Docker Image with Jib
        working-directory: './TeamAI Backend/intelligence-service'
        run: |
          ./mvnw compile jib:build \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_PROJECT }}
          cluster-name: ${{ secrets.AZURE_CLUSTER }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/intelligence-service intelligence-service=${{ env.IMAGE_NAME }}:${{ github.sha }} -n distributed-team-ai-ns
          kubectl rollout status deployment/intelligence-service -n distributed-team-ai-ns --timeout=5m