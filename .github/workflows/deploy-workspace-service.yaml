name: Deploy Workspace Service

on:
  push:
    branches:
      - master
  paths:
    - 'TeamAI Backend/workspace-service/**'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/distributed-team-ai-workspace-service

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Workspace Service to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Install Common Lib
        working-directory: './TeamAI Backend/common-lib'
        run: ./mvnw clean install -DskipTests

      - name: Build and Push Docker Image with Jib
        working-directory: './TeamAI Backend/workspace-service'
        run: |
          ./mvnw compile jib:build \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_PROJECT }}
          cluster-name: ${{ secrets.AZURE_CLUSTER }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/workspace-service workspace-service=${{ env.IMAGE_NAME }}:${{ github.sha }} -n distributed-team-ai-ns
          kubectl rollout status deployment/workspace-service -n distributed-team-ai-ns