# k8s/proxy/proxy-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-team-ai-proxy
  namespace: distributed-team-ai-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-team-ai-proxy
  template:
    metadata:
      labels:
        app: distributed-team-ai-proxy
    spec:
      containers:
        - name: distributed-team-ai-proxy
          image: aditya1singh/distributed-team-ai-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: teamai-shared-config
          env:
            - name: REDIS_URL
              value: "redis://redis-0.redis.distributed-team-ai-ns.svc.cluster.local:6379"
            - name: PORT
              value: "80"
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-team-ai-proxy
  namespace: distributed-team-ai-ns
spec:
  selector:
    app: distributed-team-ai-proxy
  ports:
    - port: 80
      targetPort: 80