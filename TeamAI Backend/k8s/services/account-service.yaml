# k8s/services/account-service.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: distributed-team-ai-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: aditya1singh/distributed-team-ai-account-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9050
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: CONFIG_SERVER_URL
              value: http://config-service.distributed-team-ai-ns.svc.cluster.local:8888
            - name: SPRING_CLOUD_CONFIG_FAIL_FAST
              value: "false"
            - name: SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS
              value: "10"
            - name: SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL
              value: "3000"
            - name: ACCOUNT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ACCOUNT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: STRIPE_API_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: teamai-shared-config
                  key: APP_FRONTEND_URL
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 800m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /account/actuator/health
              port: 9050
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /account/actuator/health
              port: 9050
            failureThreshold: 90 # 90 * 10s = 900s max startup time
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: distributed-team-ai-ns
spec:
  selector:
    app: account-service
  ports:
    - port: 80
      targetPort: 9050
