apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-service-account
  namespace: distributed-team-ai-ns

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-manager-role
  namespace: distributed-team-ai-previews-ns
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-manager-binding
  namespace: distributed-team-ai-previews-ns
subjects:
  - kind: ServiceAccount
    name: workspace-service-account
    namespace: distributed-team-ai-ns # Note the cross-namespace reference here
roleRef:
  kind: Role
  name: preview-manager-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-service
  namespace: distributed-team-ai-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-service
  template:
    metadata:
      labels:
        app: workspace-service
    spec:
      serviceAccountName: workspace-service-account
      containers:
        - name: workspace-service
          image: aditya1singh/distributed-team-ai-workspace-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9020
          envFrom:
            - configMapRef:
                name: teamai-shared-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: CONFIG_SERVER_URL
              value: http://config-service.distributed-team-ai-ns.svc.cluster.local:8888
            - name: SPRING_CLOUD_CONFIG_FAIL_FAST
              value: "false"
            - name: SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS
              value: "10"
            - name: SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL
              value: "3000"
            - name: WORKSPACE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WORKSPACE_DB_PASSWORD
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 800m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /workspace/actuator/health
              port: 9020
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /workspace/actuator/health
              port: 9020
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-service
  namespace: distributed-team-ai-ns
spec:
  selector:
    app: workspace-service
  ports:
    - port: 80
      targetPort: 9020
