apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-pool
  namespace: distributed-team-ai-previews-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner-pool
      status: idle
  template:
    metadata:
      labels:
        app: runner-pool
        status: idle
    spec:
      volumes:
        - name: workspace
          emptyDir: {}
      containers:
        # 1. THE RUNNER (Vite / Node.js)
        - name: runner
          image: node:20-alpine
          workingDir: /app
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /app
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"

        # 2. THE SYNCER (MinIO mc)
        - name: syncer
          image: minio/mc
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ACCESS_KEY
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KE
            - name: MC_HOST_myminio
              value: "http://$(MINIO_USER):$(MINIO_PASS)@minio.distributed-team-ai-ns.svc.cluster.local:9000"
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"